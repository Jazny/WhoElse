<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WhoElse</title>
<style>
  /* One dark theme: onyx background, white text, purple details. */
  :root {
    color-scheme: dark;
    --bg: #0f0f12; --panel: #17171c; --text: #ffffff; --muted: #c9c3ff;
    --line: #2a2733; --accent: #582eff; --accent-hover: #8573ff; --accent-text: #ffffff;
    --highlight: #8573ff; --you: #582eff; --npc: #1f1d26; --error: #ff8a8a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
    height: 100vh; display: flex;
  }
  aside {
    width: 280px; flex-shrink: 0; border-right: 1px solid var(--line);
    background: var(--panel); display: flex; flex-direction: column; overflow-y: auto;
  }
  aside h1 { font-size: 20px; margin: 16px; color: var(--highlight); }
  #npc-list { list-style: none; margin: 0; padding: 0; }
  #npc-list li { position: relative; }
  #npc-list button.npc {
    width: 100%; text-align: left; border: 0; background: none; color: inherit;
    padding: 10px 44px 10px 16px; cursor: pointer; font: inherit;
  }
  #npc-list button.npc:hover, #npc-list li:hover button.npc { background: var(--npc); }
  #npc-list button.active { background: var(--npc); font-weight: 600; box-shadow: inset 3px 0 0 var(--highlight); }
  #npc-list small { display: block; color: var(--muted); font-weight: normal; }
  /* The "..." button appears when hovering an NPC (or while its menu is open). */
  .dots {
    position: absolute; top: 8px; right: 8px; width: 28px; height: 28px;
    border: 0; border-radius: 6px; background: none; color: var(--text);
    font-size: 18px; line-height: 1; cursor: pointer; opacity: 0;
  }
  #npc-list li:hover .dots, .dots:focus-visible, .dots[aria-expanded="true"] { opacity: 1; }
  .dots:hover, .dots[aria-expanded="true"] { background: var(--accent); }
  .menu {
    position: absolute; top: 38px; right: 8px; z-index: 10; padding: 4px;
    background: var(--panel); border: 1px solid var(--accent); border-radius: 8px;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
  }
  .menu button {
    display: block; white-space: nowrap; border: 0; border-radius: 6px; background: none;
    color: var(--text); font: inherit; font-size: 14px; padding: 8px 12px; cursor: pointer;
  }
  .menu button:hover { background: var(--accent); }
  dialog {
    width: min(520px, calc(100vw - 32px)); max-height: calc(100vh - 64px); overflow-y: auto;
    background: var(--panel); color: var(--text); border: 1px solid var(--accent);
    border-radius: 12px; padding: 20px 24px;
  }
  dialog::backdrop { background: rgba(0, 0, 0, 0.65); }
  dialog h3 { margin: 0 0 12px; color: var(--highlight); font-size: 20px; }
  dialog dt { margin-top: 12px; font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
  dialog dd { margin: 2px 0 0; white-space: pre-wrap; }
  dialog dd ul { margin: 0; padding-left: 20px; }
  dialog dd.none { color: var(--muted); font-style: italic; }
  dialog .actions { margin-top: 20px; text-align: right; }
  details { margin: 16px; }
  summary { cursor: pointer; font-weight: 600; color: var(--highlight); }
  form.create label { display: block; margin-top: 10px; font-size: 14px; color: var(--muted); }
  form.create input, form.create textarea {
    width: 100%; font: inherit; padding: 6px 8px; margin-top: 2px;
    border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--text);
  }
  button.primary {
    background: var(--accent); color: var(--accent-text); border: 0; border-radius: 6px;
    padding: 8px 14px; font: inherit; cursor: pointer;
  }
  button.primary:hover { background: var(--accent-hover); }
  button.primary:disabled { opacity: 0.5; cursor: default; }
  button.link { background: none; border: 0; color: var(--highlight); cursor: pointer; font: inherit; text-decoration: underline; }
  main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  header { padding: 14px 20px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  header h2 { margin: 0; font-size: 18px; }
  #messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
  .bubble { max-width: 70%; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--line); white-space: pre-wrap; }
  .bubble.you { align-self: flex-end; background: var(--you); border-color: var(--you); }
  .bubble.you .who { color: #e4deff; }
  .bubble.npc { align-self: flex-start; background: var(--npc); border-left: 3px solid var(--highlight); }
  .bubble.error { align-self: center; color: var(--error); border-color: var(--error); background: none; }
  .bubble .who { display: block; font-size: 12px; color: var(--muted); }
  .empty { color: var(--muted); margin: auto; text-align: center; }
  form.send { display: flex; gap: 8px; padding: 14px 20px; border-top: 1px solid var(--line); }
  form.send input { flex: 1; font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--text); }
  input:focus, textarea:focus { outline: 2px solid var(--highlight); outline-offset: 1px; }
  ::placeholder { color: #8e88b3; }
  .form-error { color: var(--error); font-size: 14px; margin-top: 8px; }
  @media (max-width: 700px) {
    body { flex-direction: column; height: auto; min-height: 100vh; }
    aside { width: 100%; border-right: 0; border-bottom: 1px solid var(--line); }
    main { min-height: 70vh; }
    .bubble { max-width: 90%; }
  }
</style>
</head>
<body>
<aside>
  <h1>WhoElse</h1>
  <ul id="npc-list"></ul>
  <details id="create-box">
    <summary>New NPC</summary>
    <form class="create" id="create-form">
      <label>Name <input name="name" required></label>
      <label>Personality <input name="personality" required placeholder="Nervous scholar who hides a debt"></label>
      <label>Voice <input name="voice" required placeholder="Quick, fidgety, talks over people"></label>
      <label>Backstory (optional) <textarea name="backstory" rows="2"></textarea></label>
      <label>Motivations, separated by ; (optional) <input name="motivations"></label>
      <label>Secrets, separated by ; (optional) <input name="secrets"></label>
      <div class="form-error" id="create-error"></div>
      <p><button class="primary" type="submit">Create</button></p>
    </form>
  </details>
</aside>
<dialog id="info">
  <h3 id="info-name"></h3>
  <dl id="info-fields"></dl>
  <div class="actions"><button class="primary" id="info-close">Close</button></div>
</dialog>
<main>
  <header>
    <h2 id="title">Pick an NPC to talk to</h2>
    <button class="link" id="clear" hidden>Clear memory</button>
  </header>
  <div id="messages"><p class="empty">Choose an NPC on the left, or create a new one.</p></div>
  <form class="send" id="send-form">
    <input id="message" placeholder="Say something..." autocomplete="off" disabled>
    <button class="primary" id="send" type="submit" disabled>Send</button>
  </form>
</main>
<script>
  let current = null;
  const $ = (id) => document.getElementById(id);

  async function api(method, path, body) {
    const response = await fetch(path, {
      method,
      headers: body ? { "Content-Type": "application/json" } : {},
      body: body ? JSON.stringify(body) : undefined,
    });
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || "Something went wrong.");
    return data;
  }
  const npcPath = (name) => "/api/npcs/" + encodeURIComponent(name);

  function bubble(kind, who, text) {
    const div = document.createElement("div");
    div.className = "bubble " + kind;
    if (who) {
      const label = document.createElement("span");
      label.className = "who";
      label.textContent = who;
      div.appendChild(label);
    }
    div.appendChild(document.createTextNode(text));
    $("messages").appendChild(div);
    $("messages").scrollTop = $("messages").scrollHeight;
    return div;
  }

  async function loadList() {
    const npcs = await api("GET", "/api/npcs");
    const list = $("npc-list");
    list.innerHTML = "";
    if (!npcs.length) $("create-box").open = true;
    for (const npc of npcs) {
      const li = document.createElement("li");
      const button = document.createElement("button");
      button.textContent = npc.name;
      const small = document.createElement("small");
      small.textContent = npc.personality;
      button.appendChild(small);
      button.className = "npc" + (npc.name === current ? " active" : "");
      button.onclick = () => openNpc(npc.name);
      li.appendChild(button);
      li.appendChild(dotsMenu(npc.name));
      list.appendChild(li);
    }
  }

  // The "..." button next to each NPC, and its one-item menu.
  function dotsMenu(name) {
    const wrap = document.createElement("div");
    const dots = document.createElement("button");
    dots.className = "dots";
    dots.textContent = "\u22EF";
    dots.title = "More options";
    dots.setAttribute("aria-label", "More options for " + name);
    dots.setAttribute("aria-expanded", "false");
    const menu = document.createElement("div");
    menu.className = "menu";
    menu.hidden = true;
    const view = document.createElement("button");
    view.textContent = "View character information";
    view.onclick = () => { closeMenus(); showInfo(name); };
    menu.appendChild(view);
    dots.onclick = (event) => {
      event.stopPropagation();
      const opening = menu.hidden;
      closeMenus();
      menu.hidden = !opening;
      dots.setAttribute("aria-expanded", String(opening));
    };
    wrap.append(dots, menu);
    return wrap;
  }

  function closeMenus() {
    document.querySelectorAll(".menu").forEach((menu) => (menu.hidden = true));
    document.querySelectorAll(".dots").forEach((dots) => dots.setAttribute("aria-expanded", "false"));
  }
  document.addEventListener("click", (event) => {
    if (!event.target.closest(".menu")) closeMenus();
  });
  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape") closeMenus();
  });

  async function showInfo(name) {
    let npc;
    try {
      npc = await api("GET", npcPath(name));
    } catch (error) {
      alert(error.message);
      return;
    }
    $("info-name").textContent = npc.name;
    const fields = $("info-fields");
    fields.innerHTML = "";
    const rows = [
      ["Personality", npc.personality],
      ["Voice", npc.voice],
      ["Backstory", npc.backstory],
      ["Motivations", npc.motivations],
      ["Secrets", npc.secrets],
    ];
    for (const [label, value] of rows) {
      const dt = document.createElement("dt");
      dt.textContent = label;
      const dd = document.createElement("dd");
      const empty = Array.isArray(value) ? !value.length : !value;
      if (empty) {
        dd.className = "none";
        dd.textContent = "None";
      } else if (Array.isArray(value)) {
        const ul = document.createElement("ul");
        for (const item of value) {
          const li = document.createElement("li");
          li.textContent = item;
          ul.appendChild(li);
        }
        dd.appendChild(ul);
      } else {
        dd.textContent = value;
      }
      fields.append(dt, dd);
    }
    $("info").showModal();
  }
  $("info-close").onclick = () => $("info").close();
  // Clicking the dark area outside the box closes it too.
  $("info").onclick = (event) => {
    const box = $("info").getBoundingClientRect();
    const outside = event.clientX < box.left || event.clientX > box.right
      || event.clientY < box.top || event.clientY > box.bottom;
    if (outside) $("info").close();
  };

  async function openNpc(name) {
    current = name;
    $("title").textContent = "Talking to " + name;
    $("clear").hidden = false;
    $("message").disabled = false;
    $("send").disabled = false;
    $("messages").innerHTML = "";
    loadList();
    try {
      const history = await api("GET", npcPath(name) + "/history");
      if (!history.length) $("messages").innerHTML = '<p class="empty">No conversation yet. Say hello.</p>';
      for (const exchange of history) {
        bubble("you", "You", exchange.dm_message);
        bubble("npc", name, exchange.npc_reply);
      }
    } catch (error) {
      bubble("error", "", error.message);
    }
    $("message").focus();
  }

  $("send-form").onsubmit = async (event) => {
    event.preventDefault();
    const text = $("message").value.trim();
    if (!text || !current) return;
    const name = current;
    $("messages").querySelector(".empty")?.remove();
    bubble("you", "You", text);
    $("message").value = "";
    $("send").disabled = true;
    const waiting = bubble("npc", name, "...");
    try {
      const { reply } = await api("POST", npcPath(name) + "/messages", { message: text });
      waiting.remove();
      if (name === current) bubble("npc", name, reply);
    } catch (error) {
      waiting.remove();
      bubble("error", "", "Error: " + error.message);
    }
    $("send").disabled = false;
    $("message").focus();
  };

  $("clear").onclick = async () => {
    if (!current || !confirm("Erase everything " + current + " remembers? Their profile is kept.")) return;
    await api("DELETE", npcPath(current) + "/history");
    openNpc(current);
  };

  $("create-form").onsubmit = async (event) => {
    event.preventDefault();
    $("create-error").textContent = "";
    const data = Object.fromEntries(new FormData(event.target));
    try {
      const npc = await api("POST", "/api/npcs", data);
      event.target.reset();
      $("create-box").open = false;
      openNpc(npc.name);
    } catch (error) {
      $("create-error").textContent = error.message;
    }
  };

  loadList();
</script>
</body>
</html>
