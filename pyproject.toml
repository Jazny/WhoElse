[project]
name = "npc-dm-helper"
version = "0.1.0"
description = "Open-source D&D Dungeon Master helper: create NPCs and talk to them in character with Claude."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic",
    "click",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
whoelse = "npc_dm.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["npc_dm"]
